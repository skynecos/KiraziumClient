name: Roll back broken KiraziumClient 2.7 release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/rollback-2.7-trigger.txt"

permissions:
  contents: write

jobs:
  rollback-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify and remove only broken 2.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/kiraziumclient-2.7")"
          test "$(jq -r '.id' <<<"$RELEASE_JSON")" = "399571677"
          test "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" = "0e6d37539012a3a589109b36a5a703b06ed4d090"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = "false"
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = "false"

          gh release view kiraziumclient-2.6 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release delete kiraziumclient-2.7 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

          if gh release view kiraziumclient-2.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::KiraziumClient 2.7 release still exists"
            exit 1
          fi
          gh release view kiraziumclient-2.6 --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "Broken KiraziumClient 2.7 release and tag removed; 2.6 preserved."
