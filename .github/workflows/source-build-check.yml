name: KiraziumClient Source Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/source-build-check.yml"
      - ".github/source-build-trigger.txt"

permissions:
  contents: read
  actions: read

env:
  LAUNCHER_NDK_VERSION: "29.0.14206865"
  EXPECTED_KIRAZIUM_CERT_SHA256: "912671e0b010d902cf148b673c4edf2f5560c86afa2e02f877f2862e0e0de90d"
  EXPECTED_KIRAZIUM_KEYSTORE_SHA256: "be1bc024531f15fa4cd0a21d3a12681e7c122535e1224ee2573dd98c1e57054d"

jobs:
  build-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout KiraziumClient
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install pinned Android build tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1 || true)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;${LAUNCHER_NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"

      - name: Get pinned LTW renderer
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          commit: 3aca75d9f3f05afd0b02a3d8f686084d968fa200
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile full release
        run: |
          set -euo pipefail
          chmod +x gradlew
          unset ANDROID_NDK_ROOT
          ./gradlew :app_pojavlauncher:assembleFullRelease --stacktrace

      - name: Verify APK output exists
        run: |
          set -euo pipefail
          APK="$(find app_pojavlauncher/build/outputs/apk/full/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          echo "Source build succeeded: $APK"

      - name: Sign and verify test APK
        env:
          KIRAZIUM_KEYSTORE_B64: ${{ secrets.KIRAZIUM_KEYSTORE_B64 }}
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find app_pojavlauncher/build/outputs/apk/full/release -type f -name '*.apk' | head -n 1)"
          SIGNING_DIR="$RUNNER_TEMP/kirazium-signing"
          mkdir -p "$SIGNING_DIR" out
          chmod 700 "$SIGNING_DIR"
          printf '%s' "$KIRAZIUM_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$SIGNING_DIR/kirazium-release.jks"
          chmod 600 "$SIGNING_DIR/kirazium-release.jks"
          test "$(sha256sum "$SIGNING_DIR/kirazium-release.jks" | awk '{print $1}')" = "$EXPECTED_KIRAZIUM_KEYSTORE_SHA256"

          SIGNING_PASSWORD="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          export KIRAZIUM_SIGNING_PASSWORD="$SIGNING_PASSWORD"
          "$APKSIGNER" sign \
            --ks "$SIGNING_DIR/kirazium-release.jks" \
            --ks-key-alias kirazium \
            --ks-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --key-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --out out/KiraziumClient-2.6-menu-test-SIGNED.apk \
            "$APK"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs out/KiraziumClient-2.6-menu-test-SIGNED.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"
          SIGNED_CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/{value=$NF; gsub(":", "", value); print tolower(value); exit}')"
          test "$SIGNED_CERT_SHA256" = "$EXPECTED_KIRAZIUM_CERT_SHA256"
          sha256sum out/KiraziumClient-2.6-menu-test-SIGNED.apk > out/KiraziumClient-2.6-menu-test-SIGNED.apk.sha256

      - name: Upload signed test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KiraziumClient-2.6-menu-test
          path: |
            out/KiraziumClient-2.6-menu-test-SIGNED.apk
            out/KiraziumClient-2.6-menu-test-SIGNED.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/kirazium-signing"
