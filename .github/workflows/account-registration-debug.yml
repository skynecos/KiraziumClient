name: Kirazium Account Registration Debug APK

on:
  push:
    branches:
      - test/kirazium-account-registration
    paths:
      - ".github/workflows/account-registration-debug.yml"
      - "app_pojavlauncher/build.gradle"
      - "app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/KiraziumRegisterFragment.java"
      - "app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/SelectAuthFragment.java"
      - "app_pojavlauncher/src/main/res/layout/fragment_kirazium_register.xml"
      - "app_pojavlauncher/src/main/res/layout/fragment_select_auth_method.xml"
      - "app_pojavlauncher/src/main/res/values/kirazium_account_strings.xml"
      - "app_pojavlauncher/src/main/res/values-tr/kirazium_account_strings.xml"

permissions:
  contents: read
  actions: read

env:
  LAUNCHER_NDK_VERSION: "29.0.14206865"

jobs:
  debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install pinned Android build tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1 || true)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;${LAUNCHER_NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"

      - name: Get pinned LTW renderer
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          commit: 3aca75d9f3f05afd0b02a3d8f686084d968fa200
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile non-release debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          unset ANDROID_NDK_ROOT
          ./gradlew :app_pojavlauncher:assembleFullDebug --stacktrace

      - name: Verify debug package and checksum
        run: |
          set -euo pipefail
          APK="$(find app_pojavlauncher/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.kirazium.launcher.debug'" >/dev/null
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify "$APK"
          mkdir -p out
          cp "$APK" out/KiraziumAccountRegistration-DEBUG.apk
          sha256sum out/KiraziumAccountRegistration-DEBUG.apk > out/KiraziumAccountRegistration-DEBUG.apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KiraziumAccountRegistration-DEBUG
          path: |
            out/KiraziumAccountRegistration-DEBUG.apk
            out/KiraziumAccountRegistration-DEBUG.apk.sha256
          if-no-files-found: error
          retention-days: 7
